<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#05081a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Mando</title>
<style>
  :root{
    --bg:#0e1431; --line:#9aa6c8;
    --blue:#4a9bff; --orange:#f0a830; --teal:#2fd3b5; --purple:#8b6cff; --red:#ff4d5e;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:none}
  html,body{margin:0;height:100%;background:#05081a;overflow:hidden;font-family:system-ui,sans-serif}
  #wrap{position:fixed;inset:0;display:grid;place-items:center}
  #stage{position:relative;width:807px;height:368px;background:var(--bg);border-radius:22px;transform-origin:center;overflow:hidden;box-shadow:0 0 0 2px #1b2450 inset}
  svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
  #pad{position:absolute;inset:0;pointer-events:none}
  #pad>*{pointer-events:auto}

  .gray{--c:var(--line)} .b{--c:var(--blue)} .o{--c:var(--orange)} .t{--c:var(--teal)} .p{--c:var(--purple)} .r{--c:var(--red)}

  .btn{position:absolute;transform:translate(-50%,-50%);width:var(--s);height:var(--s);border-radius:50%;
    border:2.5px solid var(--c);color:var(--c);background:rgba(255,255,255,.02);
    display:grid;place-items:center;cursor:pointer;transition:transform .06s,background .06s,box-shadow .06s}
  .btn .ico{width:50%;height:50%}
  .btn.big .ico{width:44%;height:44%}
  .btn .txt{font-weight:800;font-size:calc(var(--s) * .42);color:var(--c);pointer-events:none}
  .btn.active{transform:translate(-50%,-50%) scale(.9);background:color-mix(in srgb,var(--c) 28%,transparent);box-shadow:0 0 18px var(--c)}
  .badge{position:absolute;top:-6px;right:-6px;min-width:22px;height:22px;padding:0 3px;border-radius:11px;
    background:var(--bg);border:1.5px solid var(--c);font-size:8.5px;line-height:19px;text-align:center;color:var(--c);font-weight:700;pointer-events:none}

  .pill{position:absolute;width:88px;height:38px;border-radius:19px;border:2px solid var(--c);color:var(--c);
    display:grid;place-items:center;cursor:pointer;transition:transform .06s,background .06s,box-shadow .06s}
  .pill .ico{width:20px;height:20px}
  .pill.active{transform:scale(.94);background:color-mix(in srgb,var(--c) 28%,transparent);box-shadow:0 0 14px var(--c)}
  .pill .tag{position:absolute;top:-8px;right:-5px;width:24px;height:24px;border-radius:50%;background:var(--bg);
    border:1.5px solid var(--c);font-size:9px;line-height:21px;text-align:center;font-weight:700;pointer-events:none}

  #gear{position:absolute;left:404px;top:22px;transform:translate(-50%,-50%);width:38px;height:38px;border-radius:50%;
    border:2.5px solid #6c82b8;color:#dfe6ff;display:grid;place-items:center;cursor:pointer;background:rgba(80,110,190,.15);z-index:2}
  #gear svg{width:55%;height:55%}
  #chip{position:absolute;left:434px;top:6px;height:22px;padding:0 10px;border-radius:11px;border:1.5px solid #6c82b8;
    color:#cfd8ff;font-size:11px;line-height:19px;background:rgba(80,110,190,.15);cursor:pointer;z-index:2;white-space:nowrap}

  #joy{position:absolute;left:28px;top:194px;width:166px;height:166px;border-radius:50%;
    border:2px solid #6f7aa0;background:radial-gradient(circle,#101840 0%,#0d1332 100%)}
  #joy .ring{position:absolute;inset:26px;border-radius:50%;border:1.5px solid #4a5580}
  #joy i{position:absolute;color:#8d98bd;font-size:13px;font-style:normal}
  #joy .u{top:7px;left:50%;transform:translateX(-50%)} #joy .d{bottom:7px;left:50%;transform:translateX(-50%)}
  #joy .l{left:8px;top:50%;transform:translateY(-50%)} #joy .r{right:8px;top:50%;transform:translateY(-50%)}
  #knob{position:absolute;left:50%;top:50%;width:62px;height:62px;margin:-31px 0 0 -31px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#dcdde3,#9b9ea9 70%);box-shadow:0 3px 8px rgba(0,0,0,.5)}

  #status{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);font-size:11px;color:#6d7bab;display:flex;align-items:center;gap:6px;cursor:pointer;z-index:2}
  #dot{width:9px;height:9px;border-radius:50%;background:#555c7a}
  #dot.ok{background:#3fd49a;box-shadow:0 0 8px #3fd49a}
  #dot.err{background:#ff5a6a}

  /* panel */
  #panel{position:absolute;inset:0;background:rgba(5,8,26,.95);display:none;place-items:center;z-index:10}
  #panel.open{display:grid}
  #card{width:770px;background:#141c44;border:1px solid #2a3566;border-radius:16px;padding:14px 18px;color:#dfe6ff}
  #card *{touch-action:auto;user-select:text;-webkit-user-select:text}
  .tabs{display:flex;gap:8px;margin-bottom:10px}
  .tabs button{padding:7px 16px;border:0;border-radius:8px;background:#1d2858;color:#9fb0e6;font-weight:700;font-size:13px;cursor:pointer}
  .tabs button.on{background:#3a56c9;color:#fff}
  #card label{display:block;font-size:12px;color:#38d6ff;margin:8px 0 4px}
  #card input,#card select{width:100%;padding:8px 10px;border-radius:10px;border:1px solid #2fb8d8;background:#05081a;color:#fff;font-size:14px}
  #tabConn{max-width:600px;margin:0 auto}
  .two{display:flex;gap:12px}.two>div{flex:1}
  .rect{position:absolute;border:2px solid var(--c);color:var(--c);border-radius:5px;display:grid;place-items:center;cursor:pointer;
    background:rgba(255,255,255,.02);transition:transform .06s,background .06s,box-shadow .06s}
  .rect .ico{width:18px;height:18px}
  .rect .txt,.trap .txt{font-size:12px;font-weight:700;letter-spacing:.6px;pointer-events:none}
  .rect.active{transform:scale(.95);background:color-mix(in srgb,var(--c) 28%,transparent);box-shadow:0 0 14px var(--c)}
  .trap{position:absolute;color:var(--c);cursor:pointer;transition:transform .06s}
  .trap svg{position:absolute;inset:0;overflow:visible;fill:rgba(255,255,255,.02);stroke:currentColor;stroke-width:2;transition:fill .06s,filter .06s}
  .trap .txt{position:relative;display:grid;place-items:center;height:100%;font-size:15px}
  .trap.active{transform:scale(.95)}
  .trap.active svg{fill:color-mix(in srgb,var(--c) 30%,transparent);filter:drop-shadow(0 0 6px var(--c))}
  .dpad{position:absolute}
  .dpad svg{overflow:visible}
  .dp{fill:rgba(255,255,255,.03);stroke:var(--line);stroke-width:1.4;stroke-linejoin:round;transition:fill .05s}
  .dp.on{fill:rgba(74,155,255,.38);stroke:var(--blue)}
  .dt{fill:none;stroke:var(--line);stroke-width:1.4;stroke-linejoin:round}
  .acts{display:flex;gap:8px;margin-top:12px}
  .acts button{flex:1;padding:10px;border:0;border-radius:10px;font-weight:700;font-size:14px;cursor:pointer;background:#26336e;color:#dfe6ff}
  .acts .ok{background:#12351f;color:#4dff7c;border:1.5px solid #2bd45c}
  #msg,#msg2{font-size:12px;color:#8d98bd;margin-top:8px;min-height:15px;line-height:1.35}
  #mapGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px 16px}
  .cell{display:flex;align-items:center;gap:6px}
  .cell .nm{width:62px;font-size:12px;color:#cfd8ff;flex:none}
  .cell select{flex:1;min-width:0;border-color:#2f3b78;padding:6px 8px;font-size:13px}
  .cell input{width:56px;flex:none;border-color:#2f3b78;padding:6px 6px;font-size:13px}
  #profs{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:4px}
  .prof{border:2px solid #2f3b78;border-radius:14px;padding:14px;background:#0b1130;cursor:pointer}
  .prof.on{border-color:#3fd49a;background:#0f2a22}
  .prof h4{margin:0 0 6px;font-size:17px;color:#fff}
  .prof p{margin:0;font-size:12px;color:#9fb0e6;line-height:1.4}
</style>
</head>
<body>
<div id="wrap">
<div id="stage">

  <div id="pad"></div>

  <div id="gear" title="Ajustes e IP">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/></svg>
  </div>
  <div id="chip">PSP</div>

  <div id="joy">
    <div class="ring"></div>
    <i class="u">▲</i><i class="d">▼</i><i class="l">◀</i><i class="r">▶</i>
    <div id="knob"></div>
  </div>

  <div id="status" title="Toca para pantalla completa"><span id="dot"></span><span id="stxt">sin conectar</span></div>

  <div id="panel">
    <div id="card">
      <div class="tabs">
        <button id="tConn" class="on">Conexión e IP</button>
        <button id="tProf">Mando</button>
        <button id="tMap">Asignar botones</button>
      </div>

      <!-- CONEXIÓN -->
      <div id="tabConn">
        <div class="two">
          <div><label>Enviar a</label>
            <select id="mode">
              <option value="psp">PPSSPP (solo con la IP)</option>
              <option value="adb">Otro emulador (ADB · puente.js)</option>
            </select></div>
          <div><label>IP del dispositivo</label>
            <input id="ip" placeholder="192.168.110.239" inputmode="decimal"></div>
        </div>
        <div class="two">
          <div><label>Controles de movimiento</label>
            <select id="mover">
              <option value="both">Joystick y cruceta</option>
              <option value="joy">Solo joystick</option>
              <option value="dpad">Solo cruceta</option>
            </select></div>
          <div><label>Joystick (solo PPSSPP)</label>
            <select id="joymode">
              <option value="analog">Analógico (stick PSP)</option>
              <option value="dpad">Como cruceta</option>
            </select></div>
        </div>
        <details style="margin-top:8px"><summary style="font-size:12px;color:#8d98bd;cursor:pointer">Avanzado</summary>
          <input id="port" placeholder="Puerto de PPSSPP (vacío = lo busca solo)" inputmode="numeric" style="margin-top:6px">
          <input id="bridge" placeholder="Puente ADB (vacío = http://IP:8080)" style="margin-top:6px">
        </details>
        <div class="acts"><button id="bConn" class="ok">Conectar</button><button id="bClose">Cerrar</button></div>
        <div id="msg"></div>
      </div>

      <!-- MANDO / PERFILES -->
      <div id="tabProf" style="display:none">
        <div id="profs"></div>
        <div class="acts"><button id="bClose3">Cerrar</button></div>
      </div>

      <!-- ASIGNAR -->
      <div id="tabMap" style="display:none">
        <div id="mapGrid"></div>
        <div class="acts">
          <button id="pDef">Restablecer</button>
          <button id="bSave" class="ok">Guardar</button>
          <button id="bClose2">Cerrar</button>
        </div>
        <div id="msg2"></div>
      </div>
    </div>
  </div>
</div>
</div>

<script>
const $ = id => document.getElementById(id);

/* ============ iconos ============ */
const ICO = {
  tri:'<path d="M12 4l8.5 15h-17z"/>',
  sq:'<rect x="5" y="5" width="14" height="14" rx="1"/>',
  cir:'<circle cx="12" cy="12" r="7.5"/>',
  x:'<path d="M5.5 5.5l13 13M18.5 5.5l-13 13"/>',
  sel:'<rect x="2" y="6" width="5" height="11" rx="1"/><rect x="9" y="5" width="6" height="12" rx="1" fill="currentColor"/><rect x="17" y="6" width="5" height="11" rx="1"/><path d="M20 20v2M18 21l2 2 2-2" stroke-width="1.6"/>',
  sta:'<path d="M4 8h15M15 4l4 4-4 4M20 16H5M9 12l-4 4 4 4"/>',
  bolt:'<path d="M13 2L5 14h6l-1 8 8-12h-6z" fill="currentColor"/>',
  l3:'<circle cx="12" cy="12" r="3.5"/><circle cx="12" cy="12" r="8"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/>',
  r3:'<path d="M12 3l5 5-5 5-5-5z" fill="currentColor"/><path d="M12 11l5 5-5 5-5-5z"/><circle cx="12" cy="12" r="9.5" stroke-width="1.2"/>',
  back:'<path d="M9 7L4 12l5 5M4 12h11a5 5 0 015 5"/>',
  l1:'<circle cx="12" cy="12" r="5.5"/><circle cx="12" cy="12" r="1.3" fill="currentColor"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/>',
  up:'<path d="M12 20V5M6 11l6-6 6 6"/>',
  down:'<path d="M12 4v15M6 13l6 6 6-6"/>',
  pause:'<path d="M9 5v14M15 5v14"/>',
  play:'<path d="M9 6l9 6-9 6z"/>'
};

/* ============ perfiles (diseños) ============ */
const LAYOUTS = {
  psp:{ name:'PSP', desc:'Como el de PPSSPP: L y R en las esquinas, cruceta, joystick, ✕ ○ □ △, Select y Start.',
    joy:{x:130,y:305,s:.72}, dpad:{x:131,y:170,s:130}, dpadAlone:{x:131,y:215,s:160},
    items:[
      {id:'L1',k:'trap',x:12,y:12,w:112,h:32,c:'gray',text:'L',pts:'2,30 14,3 110,3 110,30'},
      {id:'R1',k:'trap',x:683,y:12,w:112,h:32,c:'gray',text:'R',pts:'2,3 98,3 110,30 2,30'},
      {id:'HOME',k:'rect',x:246,y:314,w:84,h:28,c:'gray',ico:'play'},
      {id:'SELECT',k:'rect',x:366,y:314,w:84,h:28,c:'gray',text:'SELECT'},
      {id:'START',k:'rect',x:484,y:314,w:84,h:28,c:'gray',text:'START'},
      {id:'TRIANGLE',k:'btn',big:1,x:702,y:249,s:54,c:'b',ico:'tri',sw:2.4},
      {id:'SQUARE',k:'btn',big:1,x:648,y:290,s:54,c:'t',ico:'sq',sw:2.4},
      {id:'CIRCLE',k:'btn',big:1,x:756,y:290,s:54,c:'r',ico:'cir',sw:2.4},
      {id:'CROSS',k:'btn',big:1,x:702,y:331,s:54,c:'o',ico:'x',sw:2.6}
    ]},
  ps2:{ name:'PS2', desc:'Mando completo: L1 L2 R1 R2 L3 R3, ✕ ○ □ △, Start, Select, PS y Atrás.',
    items:[
      {id:'L1',k:'pill',x:10,y:4,c:'gray',ico:'l1',tag:'L1'},
      {id:'L2',k:'pill',x:10,y:48,c:'b',ico:'bolt',tag:'L2'},
      {id:'R1',k:'pill',x:660,y:4,c:'gray',ico:'up',tag:'R1'},
      {id:'R2',k:'pill',x:660,y:48,c:'b',ico:'down',tag:'R2'},
      {id:'SELECT',k:'btn',x:172,y:123,s:54,c:'o',ico:'sel',badge:'SEL'},
      {id:'START',k:'btn',x:245,y:189,s:56,c:'o',ico:'sta',badge:'STA'},
      {id:'HOME',k:'btn',x:765,y:113,s:54,c:'o',ico:'bolt',badge:'PS'},
      {id:'L3',k:'btn',x:598,y:177,s:58,c:'o',ico:'l3',badge:'L3'},
      {id:'R3',k:'btn',x:760,y:178,s:58,c:'p',ico:'r3',badge:'R3'},
      {id:'TRIANGLE',k:'btn',big:1,x:688,y:200,s:76,c:'b',ico:'tri',sw:2.6},
      {id:'SQUARE',k:'btn',big:1,x:597,y:260,s:76,c:'t',ico:'sq',sw:2.6},
      {id:'CIRCLE',k:'btn',big:1,x:757,y:260,s:66,c:'b',ico:'cir',sw:2.6},
      {id:'CROSS',k:'btn',big:1,x:679,y:292,s:92,c:'o',ico:'x',sw:2.8},
      {id:'BACK',k:'btn',x:763,y:337,s:60,c:'r',ico:'back',badge:'ATR'}
    ]},
  ms:{ name:'Metal Slug', desc:'Estilo arcade: A B C D, Coin (insert coin), Start y Pausa.',
    items:[
      {id:'COIN',k:'btn',x:330,y:62,s:56,c:'o',ico:'sel',badge:'COIN'},
      {id:'START',k:'btn',x:480,y:62,s:56,c:'o',ico:'sta',badge:'STA'},
      {id:'PAUSE',k:'btn',x:765,y:62,s:50,c:'gray',ico:'pause',badge:'II'},
      {id:'D',k:'btn',x:560,y:165,s:64,c:'b',text:'D'},
      {id:'A',k:'btn',x:640,y:235,s:90,c:'r',text:'A'},
      {id:'B',k:'btn',x:745,y:275,s:80,c:'o',text:'B'},
      {id:'C',k:'btn',x:535,y:290,s:76,c:'t',text:'C'}
    ]}
};
const DIRS_ACT = ['UP','DOWN','LEFT','RIGHT'];
const LABEL = { UP:'Arriba',DOWN:'Abajo',LEFT:'Izquierda',RIGHT:'Derecha',
  CROSS:'✕',CIRCLE:'○',SQUARE:'□',TRIANGLE:'△',L1:'L1',R1:'R1',L2:'L2',R2:'R2',L3:'L3',R3:'R3',
  START:'Start',SELECT:'Select',HOME:'Home',BACK:'Atrás',A:'A',B:'B',C:'C',D:'D',COIN:'Coin',PAUSE:'Pausa' };
function actionsOf(p){ return [...DIRS_ACT, ...LAYOUTS[p].items.map(i=>i.id)]; }

/* ============ asignaciones por defecto ============ */
const DEF = {
  psp:{ UP:'up',DOWN:'down',LEFT:'left',RIGHT:'right',
    CROSS:'cross',CIRCLE:'circle',SQUARE:'square',TRIANGLE:'triangle',
    L1:'ltrigger',R1:'rtrigger',L2:'',R2:'',L3:'',R3:'',START:'start',SELECT:'select',HOME:'home',BACK:'',
    A:'square',B:'cross',C:'circle',D:'triangle',COIN:'select',PAUSE:'' },
  adb:{ UP:'19',DOWN:'20',LEFT:'21',RIGHT:'22',
    CROSS:'96',CIRCLE:'97',SQUARE:'99',TRIANGLE:'100',
    L1:'102',R1:'103',L2:'104',R2:'105',L3:'106',R3:'107',START:'108',SELECT:'109',HOME:'3',BACK:'4',
    A:'96',B:'97',C:'99',D:'100',COIN:'109',PAUSE:'4' }
};
const PSP_OPTS = [
  ['— ninguno —',''],['✕ cross','cross'],['○ circle','circle'],['△ triangle','triangle'],['□ square','square'],
  ['↑ up','up'],['↓ down','down'],['← left','left'],['→ right','right'],
  ['L (ltrigger)','ltrigger'],['R (rtrigger)','rtrigger'],['Start','start'],['Select','select'],['Home','home']
];
const KEY_GROUPS = [
  ['Gamepad',[['A (✕)',96],['B (○)',97],['X (□)',99],['Y (△)',100],['L1',102],['R1',103],['L2',104],['R2',105],['L3',106],['R3',107],['Start',108],['Select',109],['Mode',110]]],
  ['Cruceta',[['Arriba',19],['Abajo',20],['Izquierda',21],['Derecha',22],['Centro',23]]],
  ['Sistema',[['Atrás',4],['Inicio',3],['Enter',66],['Esc',111],['Espacio',62],['Tab',61]]],
  ['Números (1 = Start, 5 = Coin en MAME)',Array.from({length:10},(_,i)=>[String(i),7+i])],
  ['Letras',Array.from({length:26},(_,i)=>[String.fromCharCode(65+i),29+i])]
];

/* ============ configuración guardada ============ */
function load(k, d){ try{ return Object.assign(d, JSON.parse(localStorage.getItem(k)||'{}')); }catch(e){ return d; } }
function store(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
let cfg  = load('mandoCfg2', { mode:'psp', ip:'192.168.110.239', port:'', bridge:'', joymode:'analog', mover:'both', profile:'psp' });
let MAPS = load('mandoMaps2', {});
if(!LAYOUTS[cfg.profile]) cfg.profile = 'psp';

function curMap(){ return { ...DEF[cfg.mode], ...(MAPS[cfg.profile+'|'+cfg.mode] || {}) }; }
function saveCfg(){
  cfg.mode = $('mode').value; cfg.ip = $('ip').value.trim(); cfg.port = $('port').value.trim();
  cfg.bridge = $('bridge').value.trim(); cfg.joymode = $('joymode').value; cfg.mover = $('mover').value;
  store('mandoCfg2', cfg); refreshChip();
}
function fillConn(){
  $('mode').value = cfg.mode; $('ip').value = cfg.ip; $('port').value = cfg.port;
  $('bridge').value = cfg.bridge; $('joymode').value = cfg.joymode; $('mover').value = cfg.mover || 'both';
}
function refreshChip(){ $('chip').textContent = LAYOUTS[cfg.profile].name + ' · ' + (cfg.mode==='psp' ? 'PPSSPP' : 'ADB'); }
function setStatus(t, c){ $('stxt').textContent = t; $('dot').className = c||''; }
function msg(t){ $('msg').textContent = t; }

/* ============ escala ============ */
const stage = $('stage');
function fit(){ stage.style.transform = `scale(${Math.min(innerWidth/807, innerHeight/368)})`; }
addEventListener('resize', fit); fit();

/* ============ dibujar el mando según el perfil ============ */
const held = {};   // PPSSPP: botón -> cantidad de botones que lo mantienen

function fire(target, down){
  if(!target) return;
  if(cfg.mode === 'psp') pressPsp(target, down); else pressKey(target, down);
  if(down && navigator.vibrate) navigator.vibrate(10);
}

function renderPad(){
  const pad = $('pad'); pad.innerHTML = '';
  const L = LAYOUTS[cfg.profile], jp = L.joy || {x:111, y:277, s:1};
  const jel = $('joy');
  jel.style.left = (jp.x-83)+'px'; jel.style.top = (jp.y-83)+'px'; jel.style.transform = `scale(${jp.s})`;
  L.items.forEach(d=>{
    const el = document.createElement('div');
    const kind = d.k==='pill' ? 'pill ' : d.k==='rect' ? 'rect ' : d.k==='trap' ? 'trap ' : 'btn ';
    el.className = kind + d.c + (d.big ? ' big' : '');
    el.style.left = d.x+'px'; el.style.top = d.y+'px';
    if(d.k==='btn') el.style.setProperty('--s', d.s+'px');
    if(d.k==='rect' || d.k==='trap'){ el.style.width = d.w+'px'; el.style.height = d.h+'px'; }
    let inner = '';
    if(d.k==='trap') inner = `<svg viewBox="0 0 ${d.w} ${d.h}" preserveAspectRatio="none"><polygon points="${d.pts}"/></svg><span class="txt">${d.text}</span>`;
    else if(d.text) inner = `<span class="txt">${d.text}</span>`;
    else if(d.ico) inner = `<svg class="ico" viewBox="0 0 24 24"${d.sw?` stroke-width="${d.sw}"`:''}>${ICO[d.ico]}</svg>`;
    if(d.tag) inner += `<span class="tag">${d.tag}</span>`;
    if(d.badge) inner += `<span class="badge">${d.badge}</span>`;
    el.innerHTML = inner;
    let target = '';
    el.addEventListener('pointerdown', e=>{
      el.setPointerCapture(e.pointerId); el.classList.add('active');
      target = curMap()[d.id]; fire(target, true);
    });
    const up = ()=>{ if(!el.classList.contains('active')) return; el.classList.remove('active'); fire(target, false); target=''; };
    el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up);
    pad.appendChild(el);
  });
  $('joy').style.display = (cfg.mover === 'dpad') ? 'none' : '';
  if(cfg.mover !== 'joy') addDpad(pad);
  refreshChip();
}

/* cruceta de 4 flechas (admite diagonales y deslizar el dedo) */
function addDpad(pad){
  const alone = cfg.mover === 'dpad';
  const L = LAYOUTS[cfg.profile];
  const g = alone ? (L.dpadAlone || {x:111, y:277, s:166}) : (L.dpad || {x:400, y:215, s:130});
  const size = g.s, x = g.x - size/2, y = g.y - size/2;
  const el = document.createElement('div'); el.className = 'dpad';
  el.style.cssText = `left:${x}px;top:${y}px;width:${size}px;height:${size}px`;
  el.innerHTML = `<svg viewBox="0 0 100 100">
    <polygon class="dp" data-d="UP"    points="35,2 65,2 65,36 50,50 35,36"/>
    <polygon class="dp" data-d="DOWN"  points="35,98 65,98 65,64 50,50 35,64"/>
    <polygon class="dp" data-d="LEFT"  points="2,35 2,65 36,65 50,50 36,35"/>
    <polygon class="dp" data-d="RIGHT" points="98,35 98,65 64,65 50,50 64,35"/>
    <polygon class="dt" points="50,11 58,24 42,24"/>
    <polygon class="dt" points="50,89 58,76 42,76"/>
    <polygon class="dt" points="11,50 24,42 24,58"/>
    <polygon class="dt" points="89,50 76,42 76,58"/>
  </svg>`;
  const pads = {}; el.querySelectorAll('.dp').forEach(p => pads[p.dataset.d] = p);
  let id = null;
  const show = n => { for(const k in pads) pads[k].classList.toggle('on', n.has(k)); };
  const update = e => {
    const r = el.getBoundingClientRect();
    const nx = (e.clientX-(r.left+r.width/2))/(r.width/2), ny = (e.clientY-(r.top+r.height/2))/(r.height/2);
    const ax = Math.abs(nx), ay = Math.abs(ny), m = Math.max(ax, ay), n = new Set();
    if(m >= 0.2){
      if(ax >= 0.45*m) n.add(nx > 0 ? 'RIGHT' : 'LEFT');
      if(ay >= 0.45*m) n.add(ny > 0 ? 'DOWN' : 'UP');
    }
    setPadDirs(n); show(n);
  };
  el.addEventListener('pointerdown', e=>{ id = e.pointerId; el.setPointerCapture(id); update(e); if(navigator.vibrate) navigator.vibrate(10); });
  el.addEventListener('pointermove', e=>{ if(e.pointerId === id) update(e); });
  const end = e=>{ if(e.pointerId !== id) return; id = null; setPadDirs(new Set()); show(new Set()); };
  el.addEventListener('pointerup', end); el.addEventListener('pointercancel', end);
  pad.appendChild(el);
}

/* ============ destino 1: PPSSPP por WebSocket ============ */
let ws = null, scanning = false, lastAx = 0, lastAy = 0;
function sendWS(o){ if(ws && ws.readyState === 1) ws.send(JSON.stringify(o)); }
function releaseAll(){ for(const k in held) held[k] = 0; lastAx = lastAy = 0; }
function pressPsp(b, down){
  held[b] = Math.max(0, (held[b]||0) + (down ? 1 : -1));
  if((down && held[b]===1) || (!down && held[b]===0)) sendWS({event:'input.buttons.send', buttons:{[b]:down}});
}

function tryPort(ip, port, timeout){
  return new Promise(res=>{
    const t0 = performance.now(); let done = false, s, t;
    const fin = ok => {
      if(done) return; done = true; clearTimeout(t);
      if(!ok){ try{ s && s.close(); }catch(e){} }
      res({ s: ok ? s : null, ms: performance.now()-t0 });
    };
    try{ s = new WebSocket(`ws://${ip}:${port}/debugger`, 'debugger.ppsspp.org'); }catch(e){ return fin(false); }
    t = setTimeout(()=>fin(false), timeout);
    s.onopen = ()=>fin(true); s.onerror = ()=>fin(false); s.onclose = ()=>fin(false);
  });
}
async function scanPorts(ip){
  const ranges = [[49152,65535],[1024,49151]];
  const total = (65535-49152+1) + (49151-1024+1);
  let done = 0, fast = 0, found = null;
  for(const [a,b] of ranges){
    let next = a, abort = false;
    const worker = async ()=>{
      while(!found && scanning && !abort && next <= b){
        const p = next++;
        const r = await tryPort(ip, p, 1500);
        done++; if(r.ms < 800) fast++;
        if(r.s){ if(!found) found = { s:r.s, p }; else r.s.close(); }
        if(done % 300 === 0){
          if(fast === 0){ abort = true; scanning = false; msg('La IP no responde. Revisa que sea la correcta y que estén en el mismo Wi-Fi.'); }
          else msg(`Buscando el puerto de PPSSPP… ${Math.round(done/total*100)}%`);
        }
      }
    };
    await Promise.all(Array.from({length:120}, worker));
    if(found || !scanning) break;
  }
  return found;
}
function adoptWS(sock){
  ws = sock;
  sock.send(JSON.stringify({event:'version', name:'MandoWeb', version:'2.0'}));
  setStatus('PPSSPP · '+cfg.ip, 'ok'); msg('Conectado.');
  $('bConn').textContent = 'Conectar';
  sock.onclose = ()=>{
    if(ws === sock){ setStatus('desconectado','err'); releaseAll(); if(!$('panel').classList.contains('open')) openPanel('conn'); }
  };
  setTimeout(()=>$('panel').classList.remove('open'), 500);
}
async function connectPSP(){
  if(location.protocol === 'https:'){
    msg('Esta página está en https:// y el navegador bloquea ws://. Ábrela desde un archivo local o desde una dirección http://.');
    setStatus('bloqueado por https','err'); return;
  }
  if(ws){ const old = ws; ws = null; try{ old.close(); }catch(e){} }
  releaseAll(); setStatus('conectando…'); msg('Conectando…');
  if(cfg.port){
    const r = await tryPort(cfg.ip, cfg.port, 2500);
    if(r.s){ adoptWS(r.s); return; }
  }
  scanning = true; $('bConn').textContent = 'Cancelar'; msg('Buscando el puerto de PPSSPP… 0%');
  const f = await scanPorts(cfg.ip);
  const was = scanning; scanning = false; $('bConn').textContent = 'Conectar';
  if(f){ cfg.port = String(f.p); $('port').value = cfg.port; store('mandoCfg2', cfg); adoptWS(f.s); }
  else if(was){
    setStatus('no encontrado','err');
    msg('No se encontró PPSSPP. Abre un juego, activa "Allow remote debugger" (Ajustes → Herramientas → Developer tools) y reintenta.');
  } else setStatus('sin conectar');
}

/* ============ destino 2: otro emulador por ADB (puente.js) ============ */
function bridgeBase(){ return (cfg.bridge || `http://${cfg.ip}:8080`).replace(/\/$/,''); }
function adbQs(extra){
  const p = { port:'5555', ...extra };
  if(cfg.bridge && cfg.ip) p.ip = cfg.ip;      // puente en otro equipo: que conecte por ADB a esa IP
  return new URLSearchParams(p).toString();
}
function pressKey(code, down){
  fetch(`${bridgeBase()}/key?${adbQs({code, state: down?'down':'up'})}`, {method:'POST', keepalive:true})
    .catch(()=> setStatus('puente no responde','err'));
}
async function connectADB(){
  if(location.protocol === 'https:' && bridgeBase().startsWith('http:')){
    msg('Esta página está en https:// y el navegador bloquea el puente http://. Ábrela desde un archivo local o desde http://.');
    setStatus('bloqueado por https','err'); return;
  }
  setStatus('conectando…'); msg('Conectando con el puente…');
  try{
    const r = await fetch(`${bridgeBase()}/connect?${adbQs({})}`, {method:'POST'});
    const t = await r.text();
    if(r.ok){ setStatus('ADB · '+cfg.ip, 'ok'); msg(t || 'Conectado.'); setTimeout(()=>$('panel').classList.remove('open'), 600); }
    else { setStatus('error ADB','err'); msg(t); }
  }catch(e){
    setStatus('puente no responde','err');
    msg(`No se pudo llegar al puente en ${bridgeBase()}. Debe estar corriendo puente.js en ese dispositivo.`);
  }
}

async function connect(){
  if(scanning){ scanning = false; msg('Búsqueda cancelada.'); $('bConn').textContent = 'Conectar'; return; }
  saveCfg();
  if(!cfg.ip){ msg('Escribe la IP.'); return; }
  if(cfg.mode === 'psp') await connectPSP(); else await connectADB();
}
$('bConn').addEventListener('click', connect);

/* ============ panel ============ */
function openPanel(tab){
  $('panel').classList.add('open');
  const tabs = { conn:'tabConn', prof:'tabProf', map:'tabMap' };
  const btns = { conn:'tConn', prof:'tProf', map:'tMap' };
  for(const k in tabs){ $(tabs[k]).style.display = (k===tab) ? '' : 'none'; $(btns[k]).classList.toggle('on', k===tab); }
  if(tab==='map') renderMap();
  if(tab==='prof') renderProfs();
}
$('gear').addEventListener('pointerdown', ()=> openPanel('conn'));
$('chip').addEventListener('pointerdown', ()=> openPanel('prof'));
$('tConn').addEventListener('click', ()=> openPanel('conn'));
$('tProf').addEventListener('click', ()=> openPanel('prof'));
$('tMap').addEventListener('click', ()=> openPanel('map'));
['bClose','bClose2','bClose3'].forEach(id => $(id).addEventListener('click', ()=>{ saveCfg(); $('panel').classList.remove('open'); }));
$('mode').addEventListener('change', ()=>{ saveCfg(); });
$('mover').addEventListener('change', ()=>{ saveCfg(); renderPad(); });
$('joymode').addEventListener('change', ()=>{ saveCfg(); });
$('status').addEventListener('click', ()=>{
  const d = document.documentElement;
  if(!document.fullscreenElement && d.requestFullscreen) d.requestFullscreen().catch(()=>{});
  else if(document.exitFullscreen) document.exitFullscreen();
});

/* ---- elegir perfil ---- */
function renderProfs(){
  const box = $('profs'); box.innerHTML = '';
  for(const k in LAYOUTS){
    const d = document.createElement('div');
    d.className = 'prof' + (k===cfg.profile ? ' on' : '');
    d.innerHTML = `<h4>${LAYOUTS[k].name}</h4><p>${LAYOUTS[k].desc}</p>`;
    d.addEventListener('click', ()=>{
      cfg.profile = k; store('mandoCfg2', cfg); renderPad(); renderProfs();
      setTimeout(()=>$('panel').classList.remove('open'), 250);
    });
    box.appendChild(d);
  }
}

/* ---- asignar botones (por perfil y por destino) ---- */
function renderMap(source){
  saveCfg();
  const g = $('mapGrid'); g.innerHTML = '';
  const src = source || curMap(), adb = cfg.mode === 'adb';
  actionsOf(cfg.profile).forEach(k=>{
    const cell = document.createElement('div'); cell.className = 'cell'; cell.dataset.k = k;
    const nm = document.createElement('span'); nm.className = 'nm'; nm.textContent = LABEL[k] || k;
    const sel = document.createElement('select');
    if(adb){
      sel.innerHTML = '<option value="">— ninguno —</option>' + KEY_GROUPS.map(([gn,items]) =>
        `<optgroup label="${gn}">${items.map(([n,v])=>`<option value="${v}">${n}</option>`).join('')}</optgroup>`).join('');
    } else {
      sel.innerHTML = PSP_OPTS.map(([n,v])=>`<option value="${v}">${n}</option>`).join('');
    }
    const has = v => [...sel.options].some(o => o.value === String(v));
    sel.value = has(src[k]) ? String(src[k]) : '';
    cell.append(nm, sel);
    if(adb){
      const num = document.createElement('input'); num.type = 'number'; num.min = 1; num.max = 300; num.value = src[k] || '';
      sel.addEventListener('change', ()=>{ num.value = sel.value; });
      num.addEventListener('input', ()=>{ sel.value = has(num.value) ? num.value : ''; });
      cell.append(num);
    }
    g.appendChild(cell);
  });
  $('msg2').textContent = `Perfil ${LAYOUTS[cfg.profile].name} · destino ${adb ? 'ADB (teclas Android)' : 'PPSSPP (botones PSP)'}.`;
}
$('pDef').addEventListener('click', ()=>{ delete MAPS[cfg.profile+'|'+cfg.mode]; store('mandoMaps2', MAPS); renderMap(); $('msg2').textContent = 'Valores originales restablecidos.'; });
$('bSave').addEventListener('click', ()=>{
  const o = {};
  document.querySelectorAll('#mapGrid .cell').forEach(c=>{
    o[c.dataset.k] = cfg.mode === 'adb' ? (c.querySelector('input').value || '') : c.querySelector('select').value;
  });
  MAPS[cfg.profile+'|'+cfg.mode] = o; store('mandoMaps2', MAPS);
  $('msg2').textContent = 'Guardado.';
  setTimeout(()=>$('panel').classList.remove('open'), 500);
});

/* ============ joystick ============ */
const joy = $('joy'), knob = $('knob'), MAXR = 52, TH = 0.45;
let joyId = null, joyDpad = true, pend = null, raf = 0;

function makeDirSet(){
  const dirs = new Map();
  return function(next){
    const m = curMap();
    for(const d of next) if(!dirs.has(d)){ const t = m[d]; dirs.set(d, t); fire(t, true); }
    for(const [d,t] of [...dirs]) if(!next.has(d)){ fire(t, false); dirs.delete(d); }
  };
}
const setDirs = makeDirSet(), setPadDirs = makeDirSet();
function flushAnalog(){
  raf = 0; if(!pend) return;
  const {x,y} = pend; pend = null;
  if(x === lastAx && y === lastAy) return;
  lastAx = x; lastAy = y;
  sendWS({event:'input.analog.send', stick:'left', x, y});
}
function moveKnob(e){
  const r = joy.getBoundingClientRect(), k = r.width/166;
  let dx = (e.clientX-(r.left+r.width/2))/k, dy = (e.clientY-(r.top+r.height/2))/k;
  const d = Math.hypot(dx,dy); if(d>MAXR){ dx*=MAXR/d; dy*=MAXR/d; }
  knob.style.transform = `translate(${dx}px,${dy}px)`;
  const x = dx/MAXR, y = dy/MAXR;
  if(joyDpad){
    const n = new Set();
    if(x>TH) n.add('RIGHT'); if(x<-TH) n.add('LEFT');
    if(y>TH) n.add('DOWN');  if(y<-TH) n.add('UP');
    setDirs(n);
  } else {
    pend = { x:+x.toFixed(3), y:+y.toFixed(3) };      // y negativa = arriba
    if(!raf) raf = requestAnimationFrame(flushAnalog);
  }
}
joy.addEventListener('pointerdown', e=>{
  joyId = e.pointerId; joy.setPointerCapture(joyId);
  joyDpad = !(cfg.mode === 'psp' && cfg.joymode === 'analog');
  moveKnob(e);
});
joy.addEventListener('pointermove', e=>{ if(e.pointerId===joyId) moveKnob(e); });
const joyEnd = e=>{
  if(e.pointerId!==joyId) return; joyId = null; knob.style.transform = 'translate(0,0)';
  if(joyDpad) setDirs(new Set()); else { pend = {x:0,y:0}; flushAnalog(); }
};
joy.addEventListener('pointerup', joyEnd); joy.addEventListener('pointercancel', joyEnd);

/* ============ inicio ============ */
fillConn(); renderPad();
